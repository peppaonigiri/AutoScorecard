# AutoModeling 全局配置

database:
  host: localhost
  port: 5432
  user: postgres
  password: "123456"
  database: scorecard
  # postgresql://postgres:123456@localhost:5432/scorecard
  # sqlite_db: "./scorecard.db"  # 临时回退到 SQLite 确保开发进度

server:
  host: "0.0.0.0"  # 允许局域网访问
  port: 8081
  debug: true
  heartbeat_enabled: false
  heartbeat_timeout: 60

storage:
  upload_dir: ./storage/uploads
  model_dir: ./storage/models
  report_dir: ./storage/reports

modeling:
  default_dep: label
  default_max_depth: 6
  default_n_trials: 100
  default_model_type: xgb

# LLM Agent 配置
agent:
  enabled: true
  llm_provider: deepseek              # 目前仅支持 deepseek（openai-compatible）
  llm_api_key: ""   # 替换为真实 Key
  llm_base_url: "https://api.deepseek.com"
  llm_model: "deepseek-chat"          # deepseek-v3 对应的 chat 模型名
  llm_timeout: 120                    # 单次 LLM 请求超时（秒）
  poll_interval: 10                   # 训练任务轮询间隔（秒）
  heartbeat_interval: 30              # 心跳刷新间隔（秒）
